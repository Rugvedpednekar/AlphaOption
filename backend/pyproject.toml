[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alphaoption-backend"
version = "0.1.0"
description = "Paper-only AlphaOption local API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "logzero==1.7.0",
  "pyotp==2.9.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "smartapi-python==1.5.5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websocket-client==1.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
alphaoption-market-data = "app.market_data.cli:main"
alphaoption-smartapi = "app.smartapi.cli:main"
alphaoption-features = "app.features.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
