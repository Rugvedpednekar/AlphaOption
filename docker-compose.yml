services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alphaoption}
      POSTGRES_USER: ${POSTGRES_USER:-alphaoption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphaoption_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      TRADING_MODE: ${TRADING_MODE:-paper}
      ENABLE_LIVE_ORDERS: "false"
      MARKET_TIMEZONE: Asia/Kolkata
      SMARTAPI_ENABLED: ${SMARTAPI_ENABLED:-false}
      SMARTAPI_API_KEY: ${SMARTAPI_API_KEY:-}
      SMARTAPI_CLIENT_CODE: ${SMARTAPI_CLIENT_CODE:-}
      SMARTAPI_PIN: ${SMARTAPI_PIN:-}
      SMARTAPI_TOTP_SECRET: ${SMARTAPI_TOTP_SECRET:-}
      SMARTAPI_API_SECRET: ${SMARTAPI_API_SECRET:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alphaoption}:${POSTGRES_PASSWORD:-alphaoption_local}@db:5432/${POSTGRES_DB:-alphaoption}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
